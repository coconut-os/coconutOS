name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Installs the pinned nightly from rust-toolchain.toml
        run: rustup toolchain install

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 mtools ovmf clang lld

      - name: Build and boot
        run: |
          # The OS boots, runs all shards (including fuzz-syscall), prints the
          # profiling summary, and halts. QEMU stays up after the halt, so stop
          # it once the halt (or a panic) is logged. A fixed timeout around the
          # whole script also cut off the cold build.
          ./scripts/qemu-run.sh > boot.log 2>&1 &
          for _ in $(seq 300); do
            grep -qE "^Halting\.|KERNEL PANIC" boot.log && break
            kill -0 $! 2>/dev/null || break
            sleep 1
          done
          pkill -f qemu-system-x86_64 || true
          cat boot.log

      - name: Verify boot succeeded
        run: |
          echo "==> Checking boot log..."
          # Seed first, so a failing random campaign can be replayed with FUZZ_SEED
          grep "fuzz: campaign" boot.log || true

          # Must reach the halt message
          if ! grep -q "all shards completed" boot.log; then
            echo "FAIL: supervisor did not complete"
            cat boot.log
            exit 1
          fi

          # Must not have a kernel panic
          if grep -q "KERNEL PANIC" boot.log; then
            echo "FAIL: kernel panic detected"
            cat boot.log
            exit 1
          fi

          # No shard may be killed by a fault handler
          if grep -q ", killing" boot.log; then
            echo "FAIL: shard killed by fault"
            grep ", killing" boot.log
            exit 1
          fi

          # Fuzz shard must run and pass all tests
          if grep -q "FAILURES DETECTED" boot.log; then
            echo "FAIL: fuzz shard reported failures"
            grep "FAIL:" boot.log
            exit 1
          fi

          if ! grep -q "ALL TESTS PASSED" boot.log; then
            echo "FAIL: fuzz shard did not report results"
            exit 1
          fi
          echo "OK: fuzz shard passed all tests"

          echo "==> Boot log summary:"
          grep -E "(booting|completed|PASS:|FAIL:|fuzz: campaign|Fuzz Summary|Profiling)" boot.log || true
          echo "==> CI passed"

      - name: Upload boot image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: coconut-boot-image
          path: target/coconut-boot.img

  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download boot image
        uses: actions/download-artifact@v4
        with:
          name: coconut-boot-image

      - name: Attach artifact to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            coconut-boot.img#"coconut-boot.img (QEMU bootable FAT32 image)" \
            --repo "${{ github.repository }}" \
            --clobber
